host: 127.0.0.1
port: 7860
portrait:
  base_url: http://127.0.0.1:9881
dialogue:
  base_url: http://127.0.0.1:8081/v1
  model: qwen2.5-3b-instruct
  max_tokens: 128
  context_turns: 6
voice:
  base_url: http://127.0.0.1:9880
  device: cuda
  language: zh
asr:
  model: models/asr/small
  device: cpu
  compute_type: int8
runtime:
  photo_streaming: false
  # 画面提速开关。portrait_sampling_steps 越少动作扩散越快（模型原生默认 50）；
  # portrait_frame_batch 是逐帧渲染的批大小，显存不足时会自动回退为逐帧。
  # portrait_frame_stride=2 表示每两帧只算一张再重复写出（25 fps 不变，动作略粗）。
  # 想完全回到原质量：steps 写 50、batch 写 1、stride 写 1。
  portrait_sampling_steps: 12
  portrait_frame_batch: 4
  portrait_frame_stride: 2
  # 首段最多这么多个字就在逗号处切开，让第一段更早进入播放队列；0 表示不切。
  first_clause_chars: 14
  # 回答模型按 SSE 流式返回，边生成边按句切分；关掉则等整段回答生成完再合成。
  dialogue_streaming: true
  # 参考声音片段的长度（秒）。片段越长，音色和说话节奏越贴近，但画面模型每块
  # 都要多读这段提示，合成会略慢；改完需要重新准备人物才会重新取样。
  voice_reference_seconds: 8
  # 声音克隆方式：hybrid 平语用零样本（声音最像）、有情绪时用指令；zero_shot 全程
  # 零样本（最像，但情绪指令失效）；instruct 全程指令（情绪准，但音色略远）。
  # 零样本需要参考音频的转写，准备人物时由本地语音识别自动生成。
  voice_clone_mode: hybrid
  # 语气（亲切/专业/活泼）是否也作用于声音。默认开：选非"自然"语气时，平语从
  # 零样本切到指令模式，语气能被听出来，代价是音色略远离参考；语气为"自然"
  # 时仍是零样本，不受影响。
  tone_voice: true
  # 每个数字人最多保存几套造型（不同穿搭/场景的照片），每套一份照片缓存。
  max_photo_variants: 8
  # 仅诊断用：固定动作扩散的随机种子，便于同一台机器上做 A/B；不承诺跨设备复现。
  portrait_seed: null
  distro: DigitalHuman
  disk_reserve_gib: 10
  idle_timeout_seconds: 900

edit:
  # 扩图目标画幅。3:4 最稳；9:16 会把一次生成拆成两段（每段纵宽比不超过
  # extend_max_ratio_per_pass），否则 SD1.5 容易在一张长图里画出重复人物。
  extend_aspect: "3:4"
  # 工作画布长边。SD1.5 原生 512，768 已接近质量上限；再大只会更慢。
  extend_working_edge: 768
  extend_steps: 36
  # 扩图比换装更依赖填充色而非提示词，所以引导强度略低。
  extend_guidance: 6.5
  # 用同一人物上半身作 IP-Adapter 参考的强度。0.25–0.55 之间；太高会把原上装
  # 复制到新生成的腿部，太低会丢掉肤色与影调连续性。0 表示关闭（不加载 adapter）。
  extend_adapter_scale: 0.35
  # 接缝羽化带宽（相对画布长边），最终会被限制在 8–24 像素。
  extend_seam_band_ratio: 0.012
  # 头顶预留高度（相对原图高度）。若原图已切到发顶，自动按 0 处理（不补头发）。
  extend_headroom_ratio: 0.05
  # 单段生成允许的最大 高/宽 比；超过则分段。
  extend_max_ratio_per_pass: 1.55
  # 人物底部到画布底已小于该比例时判定为“已接近全身”，不生成。
  extend_min_gain_ratio: 0.06
  # 单次最多向下扩展原图高度的倍数，超过就截断（避免把半身照拉成全身怪物）。
  extend_max_gain_ratio: 2.2
  # 新区域用下装/肤色底色打底（true），而不是镜像复制（false，仅调试用）。
  extend_body_prior: true
  # 输出图片的长边上限；原生画布不受此限制，只有保存的文件受限制。
  extend_output_edge: 1536
  preview:
    # 每隔多少步写一张中间图；前 skip_steps 步仍是噪声，跳过不解码。
    steps_interval: 4
    skip_steps: 2
    # 中间图长边；解码是固定成本，缩小只省编码与传输。
    long_edge: 512
    # decode：真实 VAE 解码（约 +100ms/张）；latent：潜变量投影（约 3ms，只有色块）；
    # off：关闭。显存不足自动 offload 时会强制降为 latent。
    mode: decode
  prompt:
    # 中文提示词翻译的超时与缓存条数；缓存落盘在 work/cache/prompts.json。
    timeout_seconds: 6
    cache_size: 500
  # 自定义语气（自由文本）的最大字数，必须与 backend/style.py 的 MAX_TONE_PROMPT 一致。
  max_tone_prompt: 60
